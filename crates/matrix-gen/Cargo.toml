[package]
name = "matrix-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-agent social simulator CLI — synthesize instruction data from scenarios"

[[bin]]
name = "matrix-gen"
path = "src/main.rs"

[dependencies]
matrix-gen-core = { path = "../matrix-gen-core" }
matrix-gen-rig = { path = "../matrix-gen-rig" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
